<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IBRA_Coffee</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+One&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #c27a3c;
            --primary-light: #f5ede6;
            --primary-disabled: #e0c8b3;
            --bg: var(--tg-theme-secondary-bg-color, #f8f9fa);
            --card-bg: var(--tg-theme-bg-color, #ffffff);
            --text-main: var(--tg-theme-text-color, #1a1a1a);
            --text-muted: var(--tg-theme-hint-color, #8a8a8e);
        }

        body {
            font-family: 'Rubik', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0; 
            padding: 0; 
            padding-bottom: 100px;
            -webkit-tap-highlight-color: transparent;
        }

        h1, h2, h3, .logo-text { font-family: 'Rubik One', sans-serif; font-weight: 400; margin: 0; }

        /* Шапка и главный баннер */
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: var(--bg); }
        .logo-container { display: flex; align-items: center; gap: 8px; }
        .logo-text { font-size: 20px; color: var(--text-main); text-transform: uppercase; }
        
        .hero-image {
            width: calc(100% - 40px);
            height: 180px;
            margin: 0 20px 20px;
            border-radius: 24px;
            background: url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=800&q=80') center/cover;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Секции */
        .section { display: none; padding: 0 20px 20px; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .section-title { font-size: 20px; font-weight: 600; margin: 10px 0 20px; }
        .section-subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4; }

        /* Сетка товаров */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 30px; }
        
        .card { background: #ffdec6; border-radius: 24px; padding: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); display: flex; flex-direction: column; }
        .card img { width: 100%; height: 130px; object-fit: cover; border-radius: 16px; margin-bottom: 12px; }
        .card-name { font-weight: 600; font-size: 15px; margin-bottom: 6px; line-height: 1.2; color: #1a1a1a; }
        .card-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        
        .price { font-family: 'Rubik', sans-serif; font-weight: 500; color: #1a1a1a; font-size: 16px; }
        
        .add-btn { background: var(--primary); color: white; border: none; width: 36px; height: 36px; border-radius: 12px; font-family: 'Rubik One', sans-serif; font-size: 18px; cursor: pointer; transition: 0.1s; display: flex; align-items: center; justify-content: center; }
        .add-btn:active { transform: scale(0.9); }

        /* Нижняя навигация */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card-bg); display: flex; justify-content: space-around; padding: 15px 0 25px; border-top-left-radius: 24px; border-top-right-radius: 24px; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); cursor: pointer; position: relative; width: 25%; }
        .nav-item.active { color: var(--primary); }
        .nav-item svg { width: 24px; height: 24px; margin-bottom: 4px; fill: currentColor; }
        .nav-label { font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .badge { position: absolute; top: -5px; right: 15px; background: #ff3b30; color: white; font-size: 10px; font-weight: bold; width: 16px; height: 16px; border-radius: 50%; display: none; align-items: center; justify-content: center; }

        /* Корзина */
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: #ffdec6; padding: 16px; border-radius: 20px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .cart-item-info { display: flex; flex-direction: column; flex: 1; }
        .cart-item-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; color: #1a1a1a; }
        
        .qty-controls { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.5); padding: 4px 8px; border-radius: 12px; }
        .qty-btn { background: none; border: none; font-size: 18px; color: var(--primary); font-weight: bold; cursor: pointer; padding: 0 8px; }
        .qty-val { font-weight: 600; font-size: 14px; width: 16px; text-align: center; color: #1a1a1a; }
        
        .cart-total { font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 20px; text-align: right; margin: 20px 0; }

        /* Внутри-апповая кнопка заказа */
        .main-order-btn { width: 100%; padding: 16px; border-radius: 16px; border: none; background: var(--primary); color: white; font-size: 16px; font-weight: 600; font-family: 'Rubik', sans-serif; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(194, 122, 60, 0.3); }
        .main-order-btn:disabled { background: var(--primary-disabled); cursor: not-allowed; box-shadow: none; }

        /* Формы Профиля */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase;}
        .form-group input { width: 100%; padding: 16px; border-radius: 16px; border: 1px solid transparent; background: var(--card-bg); color: var(--text-main); box-sizing: border-box; outline: none; font-family: 'Rubik', sans-serif; font-size: 16px; transition: 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }

        /* История заказов */
        .order-card { background: #ffdec6; border-radius: 20px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); color: #1a1a1a;}
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;}
        .order-num { font-family: 'Rubik One', sans-serif; font-size: 16px; }
        .status { padding: 6px 12px; border-radius: 10px; font-size: 12px; font-weight: 600; }
        .status.preparing { background: rgba(255,255,255,0.7); color: #856404; }
        .order-row { font-size: 14px; margin-bottom: 6px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-container">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);">
                <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                <line x1="6" y1="1" x2="6" y2="4"></line>
                <line x1="10" y1="1" x2="10" y2="4"></line>
                <line x1="14" y1="1" x2="14" y2="4"></line>
            </svg>
            <div class="logo-text">IBRA_Coffee</div>
        </div>
        <div style="font-size: 14px; color: var(--text-muted); font-weight: 500;">г. Владикавказ</div>
    </div>

    <!-- Главная картинка -->
    <div class="hero-image" id="hero-img"></div>

    <!-- МЕНЮ -->
    <div id="menu" class="section active">
        <div class="section-title">Кофе</div>
        <div class="grid">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?auto=format&fit=crop&w=400&q=80" alt="Эспрессо">
                <div class="card-name">Эспрессо</div>
                <div class="card-bottom"><span class="price">100 РУБ.</span><button class="add-btn" onclick="updateCart('Эспрессо', 100, 1)">+</button></div>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1534778101976-62847782c213?auto=format&fit=crop&w=400&q=80" alt="Капучино">
                <div class="card-name">Капучино</div>
                <div class="card-bottom"><span class="price">150 РУБ.</span><button class="add-btn" onclick="updateCart('Капучино', 150, 1)">+</button></div>
            </div>
        </div>

        <div class="section-title">Сэндвичи</div>
        <div class="grid">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1628840042765-356cda07504e?auto=format&fit=crop&w=400&q=80" alt="С курицей">
                <div class="card-name">С курицей</div>
                <div class="card-bottom"><span class="price">250 РУБ.</span><button class="add-btn" onclick="updateCart('Сэндвич с курицей', 250, 1)">+</button></div>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1550508139-b967012fd1dd?auto=format&fit=crop&w=400&q=80" alt="С лососем">
                <div class="card-name">С лососем</div>
                <div class="card-bottom"><span class="price">320 РУБ.</span><button class="add-btn" onclick="updateCart('Сэндвич с лососем', 320, 1)">+</button></div>
            </div>
        </div>
    </div>

    <!-- КОРЗИНА -->
    <div id="cart" class="section">
        <div class="section-title">Ваш заказ</div>
        <div id="cart-items" style="margin-bottom: 20px;"></div>
        
        <button id="in-app-order-btn" class="main-order-btn" disabled>Корзина пуста</button>
    </div>

    <!-- ЗАКАЗЫ -->
    <div id="orders" class="section">
        <div class="section-title">История заказов</div>
        <div class="order-card">
            <div class="order-header">
                <div class="order-num">#1024</div>
                <div class="status preparing">Готовится</div>
            </div>
            <div class="order-row">🕒 Сегодня, 14:30</div>
            <div class="order-row" style="font-weight: 600; margin-top: 10px;">Сумма: 400 РУБ.</div>
        </div>
    </div>

    <!-- ПРОФИЛЬ -->
    <div id="profile" class="section">
        <div class="section-title">Профиль</div>
        <div class="section-subtitle">Заполните данные один раз, и мы их запомним для будущих доставок.</div>

        <div class="form-group">
            <label>Имя получателя</label>
            <input type="text" id="name" placeholder="Например, Алан">
        </div>
        <div class="form-group">
            <label>Телефон</label>
            <input type="tel" id="phone" placeholder="+7 (___) ___-__-__">
        </div>
        <div class="form-group">
            <label>Адрес во Владикавказе</label>
            <input type="text" id="address" placeholder="Ул. Кирова, д. 50, кв. 12">
        </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('menu')">
            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-1.1-.9-2-2-2H5C3.9 4 3 4.9 3 6v8c0 2.2 1.8 4 4 4h6c2.2 0 4-1.8 4-4v-1h1c2.2 0 4-1.8 4-4s-1.8-4-4-4zm-3 6c0 1.1-.9 2-2 2H7c-1.1 0-2-.9-2-2V6h10v8zm3-3h-1V8h1c1.1 0 2 .9 2 2s-.9 2-2 2z"/></svg>
            <span class="nav-label">Меню</span>
        </div>
        <div class="nav-item" onclick="switchTab('cart')">
            <svg viewBox="0 0 24 24"><path d="M19 6h-2c0-2.8-2.2-5-5-5S7 3.2 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.7 0 3 1.3 3 3H9c0-1.7 1.3-3 3-3zm7 17H5V8h14v12z"/></svg>
            <span class="nav-label">Корзина</span>
            <div class="badge" id="cart-badge">0</div>
        </div>
        <div class="nav-item" onclick="switchTab('orders')">
            <svg viewBox="0 0 24 24"><path d="M13 12h7v1.5h-7zm0-2.5h7V11h-7zm0 5h7V16h-7zM21 4H3c-1.1 0-2 .9-2 2v13c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 15h-9V6h9v13z"/></svg>
            <span class="nav-label">Заказы</span>
        </div>
        <div class="nav-item" onclick="switchTab('profile')">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span class="nav-label">Профиль</span>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.textColor = '#ffffff';
        tg.MainButton.color = '#c27a3c';

        let cart = [];
        const DELIVERY_FEE = 150; // Стоимость доставки
        
        window.onload = () => {
            let saved = localStorage.getItem('coffeeProfile');
            if(saved) {
                let p = JSON.parse(saved);
                document.getElementById('name').value = p.name || '';
                document.getElementById('phone').value = p.phone || '';
                document.getElementById('address').value = p.address || '';
            }
            updateCartUI();
        };

        function switchTab(tabId) {
            document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            
            event.currentTarget.classList.add('active');
            document.getElementById(tabId).classList.add('active');

            document.getElementById('hero-img').style.display = (tabId === 'menu') ? 'block' : 'none';

            checkValidation();
        }

        function updateCart(name, price, delta) {
            let item = cart.find(i => i.name === name);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) cart = cart.filter(i => i.name !== name);
            } else if (delta > 0) {
                cart.push({name, price, qty: 1});
            }
            
            tg.HapticFeedback.impactOccurred('light');
            updateCartUI();
        }

        function updateCartUI() {
            let totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            let badge = document.getElementById('cart-badge');
            
            badge.style.display = totalQty > 0 ? 'flex' : 'none';
            badge.innerText = totalQty;
            
            let html = '';
            let subtotal = 0;
            if(cart.length === 0) {
                html = '<div style="text-align: center; color: var(--text-muted); padding: 40px 20px;">Ваша корзина пока пуста ☕️</div>';
            } else {
                // Добавляем строчку с доставкой в начало корзины
                html += `
                <div class="cart-item" style="padding: 12px 16px;">
                    <div class="cart-item-info">
                        <span class="cart-item-name">Доставка</span>
                    </div>
                    <div class="price">${DELIVERY_FEE} РУБ.</div>
                </div>`;

                cart.forEach((item) => {
                    subtotal += item.price * item.qty;
                    html += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <span class="cart-item-name">${item.name}</span>
                            <span class="price">${item.price * item.qty} РУБ.</span>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updateCart('${item.name}', ${item.price}, -1)">-</button>
                            <span class="qty-val">${item.qty}</span>
                            <button class="qty-btn" onclick="updateCart('${item.name}', ${item.price}, 1)">+</button>
                        </div>
                    </div>`;
                });
                
                let total = subtotal + DELIVERY_FEE;
                html += `<div class="cart-total">Итого: ${total} РУБ.</div>`;
            }
            document.getElementById('cart-items').innerHTML = html;
            checkValidation();
        }

        document.getElementById('phone').addEventListener('input', function(e) {
            let val = e.target.value.replace(/\D/g, '');
            if (val.startsWith('7') || val.startsWith('8')) val = val.slice(1);
            
            let formatted = '+7';
            if (val.length > 0) formatted += ' (' + val.substring(0, 3);
            if (val.length >= 4) formatted += ') ' + val.substring(3, 6);
            if (val.length >= 7) formatted += '-' + val.substring(6, 8);
            if (val.length >= 9) formatted += '-' + val.substring(8, 10);
            
            e.target.value = formatted;
            checkValidation();
        });

        function checkValidation() {
            let name = document.getElementById('name').value.trim();
            let phone = document.getElementById('phone').value.trim();
            let address = document.getElementById('address').value.trim();
            
            localStorage.setItem('coffeeProfile', JSON.stringify({name, phone, address}));

            let isPhoneValid = phone.length === 18;
            let isProfileValid = name && isPhoneValid && address;
            let isCartValid = cart.length > 0;
            let orderBtn = document.getElementById('in-app-order-btn');

            orderBtn.onclick = null;

            if (isCartValid && isProfileValid) {
                orderBtn.disabled = false;
                orderBtn.innerText = 'Оформить заказ';
                orderBtn.onclick = submitOrder;
                
                if(document.getElementById('cart').classList.contains('active')) {
                    tg.MainButton.setText('ОФОРМИТЬ ЗАКАЗ');
                    tg.MainButton.show();
                } else {
                    tg.MainButton.hide();
                }
            } else {
                tg.MainButton.hide();
                
                if (!isCartValid) {
                    orderBtn.disabled = true;
                    orderBtn.innerText = 'Корзина пуста';
                } else if (!isProfileValid) {
                    orderBtn.disabled = false;
                    orderBtn.innerText = 'Заполнить профиль для заказа';
                    orderBtn.onclick = function() {
                        switchTab('profile');
                        document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active'));
                        document.querySelectorAll('.nav-item')[3].classList.add('active'); 
                    };
                }
            }
        }

        ['name', 'address'].forEach(id => {
            document.getElementById(id).addEventListener('input', checkValidation);
        });

        function submitOrder() {
            let subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            let total = subtotal + DELIVERY_FEE;

            let data = {
                items: cart,
                deliveryFee: DELIVERY_FEE,
                total: total,
                customer: {
                    name: document.getElementById('name').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    address: document.getElementById('address').value.trim()
                }
            };
            
            try {
                tg.sendData(JSON.stringify(data));
                tg.close();
            } catch(e) {
                alert("Заказ успешно сформирован!\n(При запуске внутри Telegram эти данные отправятся боту)");
            }
        }

        Telegram.WebApp.onEvent('mainButtonClicked', submitOrder);
    </script>
</body>
</html>
