<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кофейня Владикавказ</title>
    <!-- Подключаем скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: var(--tg-theme-font-family, sans-serif);
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            margin: 0;
        }
        h2 { text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            box-sizing: border-box;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000000);
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h2>☕️ Заказ кофе</h2>
    <p style="text-align: center; color: var(--tg-theme-hint-color);">Доставка по Владикавказу</p>

    <div class="form-group">
        <label for="coffee">Выберите напиток:</label>
        <select id="coffee">
            <option value="Эспрессо">Эспрессо (100₽)</option>
            <option value="Капучино">Капучино (150₽)</option>
            <option value="Латте">Латте (170₽)</option>
            <option value="Раф">Раф (200₽)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="name">Ваше имя:</label>
        <input type="text" id="name" placeholder="Например, Алан">
    </div>

    <div class="form-group">
        <label for="address">Адрес доставки:</label>
        <input type="text" id="address" placeholder="Улица, дом, кв.">
    </div>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Расширяем на весь экран

        // Настраиваем главную кнопку внизу
        tg.MainButton.textColor = '#ffffff';
        tg.MainButton.color = '#ff9900';
        tg.MainButton.setText('ОФОРМИТЬ ЗАКАЗ');
        tg.MainButton.show();

        // Обработка нажатия на главную кнопку
        Telegram.WebApp.onEvent('mainButtonClicked', function() {
            let coffee = document.getElementById('coffee').value;
            let name = document.getElementById('name').value;
            let address = document.getElementById('address').value;

            if (!name || !address) {
                tg.showAlert("Пожалуйста, заполните имя и адрес!");
                return;
            }

            // Формируем данные для отправки в бота
            let data = {
                coffee: coffee,
                name: name,
                address: address
            };

            // Отправляем JSON строку в бота и закрываем окно
            tg.sendData(JSON.stringify(data));
            tg.close();
        });
    </script>
</body>
</html>
